[tool.poetry]
name = "fraude-shipping"
version = "0.1.0"
description = "Modelo de prevención de fraude orientado a ganancia: pipeline, API y MLflow"
authors = ["JuanFe <jmartinezbernal02@gmail.com>"]
readme = "README.md"
packages = [{ include = "fraude_shipping", from = "src" }]

# Solo lo que necesita la API en producción: deploy/api/requirements.txt se exporta de este grupo
[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0.6"
lightgbm = "^4.7.0"
scikit-learn = "^1.9.1"
pyarrow = "^25.0.1"
fastapi = "^0.141.1"
uvicorn = "^0.54.0"

# Notebooks y scripts: experimentos, registry de MLflow y explicabilidad
[tool.poetry.group.experimentation.dependencies]
plotly = "^7.1.0"
kaleido = "^1.4.0"
nbformat = "^5.11.1"
mlflow = "^3.16.1"
optuna = "^5.0.0"
catboost = "^1.2.10"
xgboost = "^3.4.1"
shap = "^0.52.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.3.0"
pytest = "^9.1.1"
httpx = "^0.28.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/fraude_shipping", "scripts"]

[tool.coverage.report]
fail_under = 80
